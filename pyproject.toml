[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-rag"
version = "0.1.0"
description = "Karpathy-style personal knowledge RAG system for Obsidian vaults"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "openai>=2.0.0",
    "anthropic>=0.40.0",
    "networkx>=3.0",
    "click>=8.0",
    "trafilatura>=1.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
vault-rag = "vault_rag.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "integration: end-to-end pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["vault_rag"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
